[platformio]
default_envs = esp32s3_devkitc_1
src_dir = main

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_upload.flash_size = 8MB
board_build.partitions = partitions_obj4_coredump.csv
# PlatformIO/ESP-IDF 5.x consulta esta clave del manifiesto de la placa.
# Mantener un unico sdkconfig evita que cada perfil genere uno nuevo con
# los defaults de 2 MB y garantiza la configuracion N8 en todos los binarios.
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32s3_devkitc_1

[env:esp32s3_devkitc_1]
build_flags =
    -DMETER_HW_TEST_PROFILE=0

# Variante experimental para comparar la estabilidad del SIM7080G sin que
# tres timeouts AT puedan conmutar el modulo mediante PWRKEY. No modifica el
# perfil integrado de produccion ni la logica de medicion/SD/MQTT.
[env:integration_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_FW_VERSION=\"1.1.0-obj4-nopwr\"

# A/B diagnostico: misma variante sin PWRKEY automatico, cambiando solamente
# la telemetria /datos de QoS 1 a QoS 0 para aislar el efecto sobre el modem.
[env:integration_qos0_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=0
    -DMETER_FW_VERSION=\"1.1.0-obj4-q0-nopwr\"

# Repeticion controlada de la prueba QoS 0 tras corregir el desbordamiento de
# task_storage. La version distinta evita mezclar ambos conjuntos de evidencia.
[env:integration_qos0_stackfix_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=0
    -DMETER_FW_VERSION=\"1.1.0-obj4-q0-stk1\"

# Variante de cierre: conserva la correccion de task_storage y vuelve a QoS 1
# para demostrar retencion y reenvio durante un corte controlado del broker.
[env:integration_qos1_stackfix_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-stk1\"

# q1-stk1 + reconexion ante cortes de datos de la red: reintento liviano con
# backoff, PDP ciclado como maximo una vez por corte, modem ocupado sin
# barrido de baudios ni PWRKEY, y adopcion de SMCONN tardio.
# Desde 2026-11-04 compilar este env ya NO reproduce el q1-rc1 publicado
# (meter_config.h trae AVGAIN y el codigo los cambios de q1-rc2). Binario de
# referencia: evidence/versions/2026-11-02_q1-rc1-rebuild (SHA 1d674088).
[env:integration_qos1_reconnect]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc1\"

# q1-rc1 + ajuste de ganancia de tension AVGAIN (meter_config.h) + robustez de
# colas SD (cabeza invalida retirada, error de lectura -> remontaje/cuarentena,
# alertas sin SD por cola RAM, drenado sin truncar ante error de lectura) +
# eventos PQ en events_v1.jsonl + /estado sin "online" (margen SMPUB).
# Probada en INT_AC_carga_rc2_20261104_run01 (commit 13949bf). Desde rc3
# compilar este env ya NO reproduce rc2: binario de referencia en
# evidence/versions/2026-11-04_q1-rc2-build (SHA DED9701A).
[env:integration_qos1_rc2]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc2\"

# rc2 + alertas persistidas drenadas en el ciclo de 1 s (antes 1 por latido,
# ~15 s) + perfiles sin comunicaciones no encolan alertas para la SD.
# Version candidata para P05 (24 h) y las pruebas reales documentadas.
[env:integration_qos1_rc3]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc3\"

# rc3 + escalera de recuperacion celular (E4-01: modem trabado 4 h 40 min
# contestando AT; solo lo recupero un reinicio manual del modulo):
#   N1 CFUN=0/1 a los 10 min sin publicar, N2 CFUN=1,1 a los 30 min, N3
#   CPOWD + PWRKEY a los 90 min (max 6/dia, intervalo duplicado), con sonda
#   ping/DNS para no reiniciar el modem si la falla es del broker; PWRKEY
#   automatico de nuevo activo (encendido del modem al arrancar en frio, con
#   espera de 5 min tras reinicio en caliente); operador en modo automatico
#   (COPS=0: la preferencia COPS=4 por 732-123 quedo descartada en el banco,
#   ver meter_config.h); reintento de lectura de la cola SD antes de remontar.
# Ahorro de datos (pool Kite de 6 MB/mes): historico SD y /datos cada 5 min
# (cada fila del historico genera su registro de telemetria con seq
# consecutivo) y /estado cada 30 min. Estimado ~0,35 MB/dia frente a ~1,5
# MB/dia con 60 s. El keepalive MQTT sigue en 120 s porque el broker impone
# max_keepalive 120 (un CONNECT 3.1.1 mayor se rechaza).
[env:integration_qos1_rc4]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_SD_HISTORY_PERIOD_MS=300000U
    -DMETER_COMM_ESTADO_PERIOD_MS=1800000U
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc4\"

# Mismo codigo que rc4 para la prueba de banco: tiempos de la escalera
# acortados (N1 1 min, N2 3 min, N3 6 min), autoprueba de la politica al
# arrancar y guion automatico de fallas (A: MQTT simulado 12 min sin
# reinicios esperados; C: registro ausente simulado 16 min con N1/N2/N3
# reales). No usar para E4: version distinta para no mezclar evidencia.
[env:integration_qos1_rc4_banco]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_CELL_RECOVERY_TEST_HOOKS=1
    -DMETER_CELL_RECOVERY_N1_AFTER_MS=60000U
    -DMETER_CELL_RECOVERY_N1_EARLY_MS=30000U
    -DMETER_CELL_RECOVERY_N1_MIN_GAP_MS=120000U
    -DMETER_CELL_RECOVERY_N2_AFTER_MS=180000U
    -DMETER_CELL_RECOVERY_N2_MIN_GAP_MS=360000U
    -DMETER_CELL_RECOVERY_N3_AFTER_MS=360000U
    -DMETER_CELL_RECOVERY_N3_GAP_MS=600000U
    -DMETER_CELL_RECOVERY_N3_MAX_GAP_MS=1800000U
    -DMETER_CELL_RECOVERY_PROBE_MIN_GAP_MS=60000U
    -DMETER_CELL_RECOVERY_PROBE_OK_N2_AFTER_MS=1200000U
    -DCOMM_TEST_START_MIN=2U
    -DCOMM_TEST_A_MIN=0U
    -DCOMM_TEST_B_MIN=1U
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc4-banco3\"

# Medidor encendido sin gastar datos (p. ej. noches entre ensayos): sin
# celular ni MQTT y con el modem APAGADO al arrancar (AT+CPOWD=1). ADE, RTC,
# OLED y microSD siguen activos (historico cada 60 s). Para volver a
# transmitir se graba integration_qos1_rc4: su arranque en frio enciende el
# modem solo.
[env:sin_datos_modem_apagado]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_COMM_ENABLE=0
    -DMETER_SIM7080G_POWER_OFF_WHEN_DISABLED=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc4-sindatos\"

# Metrologia en banco (P01-P04 con PCR500MA): ADE, RTC, OLED, NVS y microSD
# activos; celular y MQTT deshabilitados, sin consumo de datos ni alertas
# remotas. La microSD es la fuente de verdad del DUT: historico cada 5 s
# para reunir 30 pares por punto en 2,5 min. No se toca el PWRKEY del modem.
# r3: ajuste AVGAIN y cambios de q1-rc3; ya no encola alertas en la SD.
# metro-r1 (sin ajuste) queda en evidence/versions/2026-10-31_metro-r1-build
# y metro-r2 en evidence/versions/2026-11-04_q1-rc2-build.
[env:metrology_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_COMM_ENABLE=0
    -DMETER_SD_HISTORY_PERIOD_MS=5000U
    -DMETER_FW_VERSION=\"1.1.0-metro-r3\"

[env:test_oled]
build_flags =
    -DMETER_HW_TEST_PROFILE=1

[env:test_rtc]
build_flags =
    -DMETER_HW_TEST_PROFILE=2

[env:test_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=3

[env:test_sim_at]
build_flags =
    -DMETER_HW_TEST_PROFILE=4

# Mismo diagnostico SIM_AT, con la consola USB Serial/JTAG como primaria y
# estado visible en OLED. No activa PWRKEY ni incluye MQTT, ADE o microSD.
[env:test_sim_at_usb]
board_build.esp-idf.sdkconfig_path = sdkconfig.test_sim_tcp
build_flags =
    -DMETER_HW_TEST_PROFILE=4
    -DMETER_FW_VERSION=\"1.1.0-simat-usb-r1\"

[env:test_sim_network]
build_flags =
    -DMETER_HW_TEST_PROFILE=5

# Observacion prolongada de registro, operador y PDP sin MQTT para aislar la
# capa celular durante ciclos de aproximadamente una hora.
[env:test_sim_network_long]
build_flags =
    -DMETER_HW_TEST_PROFILE=5
    -DMETER_FW_VERSION=\"1.1.0-netdiag-r1\"

# Diagnostico MQTT aislado: modem/red/MQTT, sin ADE, microSD ni telemetria real.
# Publica probes en /diagnostico; el backend ignora ese tipo y no crea mediciones.
[env:test_sim_mqtt]
build_flags =
    -DMETER_HW_TEST_PROFILE=18
    -DMETER_FW_VERSION=\"1.1.0-mqtt-r2\"

# Prueba TCP corta contra el dominio HTTPS alterno de Railway, sin MQTT ni publicaciones.
[env:test_sim_tcp]
board_build.esp-idf.sdkconfig_path = sdkconfig.test_sim_tcp
build_flags =
    -DMETER_HW_TEST_PROFILE=19
    -DMETER_FW_VERSION=\"1.1.0-tcpdiag-r8\"

[env:test_sim_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=7

[env:test_oled_rtc]
build_flags =
    -DMETER_HW_TEST_PROFILE=8

[env:test_oled_rtc_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=9

[env:test_all_no_ade]
build_flags =
    -DMETER_HW_TEST_PROFILE=6
    -DMETER_SIM7080G_FOCUS_MODE=1

[env:test_system_contracts]
build_flags =
    -DMETER_HW_TEST_PROFILE=10

[env:test_rtc_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=11

[env:test_oled_rtc_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=12

[env:test_sd_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=13
    -DSTORAGE_SERVICE_TEST_HOOKS=1
    -DMETER_SD_BASE_DIR=\"codex_sd_test\"
    -DMETER_STORAGE_TEST_EPOCH=1767225600LL

[env:test_oled_rtc_sd_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=14
    -DMETER_SIM7080G_FOCUS_MODE=1

[env:test_ade_smoke]
build_flags =
    -DMETER_HW_TEST_PROFILE=15

[env:test_ade_measurement]
build_flags =
    -DMETER_HW_TEST_PROFILE=16

[env:test_ade_full]
build_flags =
    -DMETER_HW_TEST_PROFILE=17

# Integracion funcional mientras la microSD permanece fisicamente retirada.
# Mantiene ADE, RTC, OLED, SIM7080G, MQTT, NVS y PQ; publica /datos en vivo.
[env:integration_no_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_STORAGE_ENABLE=0
