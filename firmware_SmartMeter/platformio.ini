[platformio]
default_envs = esp32s3_devkitc_1
src_dir = main

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_upload.flash_size = 8MB
board_build.partitions = partitions_obj4_coredump.csv
# PlatformIO/ESP-IDF 5.x consulta esta clave del manifiesto de la placa.
# Mantener un unico sdkconfig evita que cada perfil genere uno nuevo con
# los defaults de 2 MB y garantiza la configuracion N8 en todos los binarios.
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32s3_devkitc_1

[env:esp32s3_devkitc_1]
build_flags =
    -DMETER_HW_TEST_PROFILE=0

# Variante experimental para comparar la estabilidad del SIM7080G sin que
# tres timeouts AT puedan conmutar el modulo mediante PWRKEY. No modifica el
# perfil integrado de produccion ni la logica de medicion/SD/MQTT.
[env:integration_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_FW_VERSION=\"1.1.0-obj4-nopwr\"

# A/B diagnostico: misma variante sin PWRKEY automatico, cambiando solamente
# la telemetria /datos de QoS 1 a QoS 0 para aislar el efecto sobre el modem.
[env:integration_qos0_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=0
    -DMETER_FW_VERSION=\"1.1.0-obj4-q0-nopwr\"

# Repeticion controlada de la prueba QoS 0 tras corregir el desbordamiento de
# task_storage. La version distinta evita mezclar ambos conjuntos de evidencia.
[env:integration_qos0_stackfix_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=0
    -DMETER_FW_VERSION=\"1.1.0-obj4-q0-stk1\"

# Variante de cierre: conserva la correccion de task_storage y vuelve a QoS 1
# para demostrar retencion y reenvio durante un corte controlado del broker.
[env:integration_qos1_stackfix_no_auto_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-stk1\"

# q1-stk1 + reconexion ante cortes de datos de la red: reintento liviano con
# backoff, PDP ciclado como maximo una vez por corte, modem ocupado sin
# barrido de baudios ni PWRKEY, y adopcion de SMCONN tardio.
[env:integration_qos1_reconnect]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_SIM7080G_AUTO_PWRKEY_RECOVERY=0
    -DMETER_MQTT_PUBLISH_QOS=1
    -DMETER_FW_VERSION=\"1.1.0-obj4-q1-rc1\"

# Metrologia en banco (P01-P04 con PCR500MA): ADE, RTC, OLED, NVS y microSD
# activos; celular y MQTT deshabilitados, sin consumo de datos ni alertas
# remotas. La microSD es la fuente de verdad del DUT: historico cada 5 s
# para reunir 30 pares por punto en 2,5 min. No se toca el PWRKEY del modem.
[env:metrology_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_COMM_ENABLE=0
    -DMETER_SD_HISTORY_PERIOD_MS=5000U
    -DMETER_FW_VERSION=\"1.1.0-metro-r1\"

[env:test_oled]
build_flags =
    -DMETER_HW_TEST_PROFILE=1

[env:test_rtc]
build_flags =
    -DMETER_HW_TEST_PROFILE=2

[env:test_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=3

[env:test_sim_at]
build_flags =
    -DMETER_HW_TEST_PROFILE=4

# Mismo diagnostico SIM_AT, con la consola USB Serial/JTAG como primaria y
# estado visible en OLED. No activa PWRKEY ni incluye MQTT, ADE o microSD.
[env:test_sim_at_usb]
board_build.esp-idf.sdkconfig_path = sdkconfig.test_sim_tcp
build_flags =
    -DMETER_HW_TEST_PROFILE=4
    -DMETER_FW_VERSION=\"1.1.0-simat-usb-r1\"

[env:test_sim_network]
build_flags =
    -DMETER_HW_TEST_PROFILE=5

# Observacion prolongada de registro, operador y PDP sin MQTT para aislar la
# capa celular durante ciclos de aproximadamente una hora.
[env:test_sim_network_long]
build_flags =
    -DMETER_HW_TEST_PROFILE=5
    -DMETER_FW_VERSION=\"1.1.0-netdiag-r1\"

# Diagnostico MQTT aislado: modem/red/MQTT, sin ADE, microSD ni telemetria real.
# Publica probes en /diagnostico; el backend ignora ese tipo y no crea mediciones.
[env:test_sim_mqtt]
build_flags =
    -DMETER_HW_TEST_PROFILE=18
    -DMETER_FW_VERSION=\"1.1.0-mqtt-r2\"

# Prueba TCP corta contra el dominio HTTPS alterno de Railway, sin MQTT ni publicaciones.
[env:test_sim_tcp]
board_build.esp-idf.sdkconfig_path = sdkconfig.test_sim_tcp
build_flags =
    -DMETER_HW_TEST_PROFILE=19
    -DMETER_FW_VERSION=\"1.1.0-tcpdiag-r8\"

[env:test_sim_pwrkey]
build_flags =
    -DMETER_HW_TEST_PROFILE=7

[env:test_oled_rtc]
build_flags =
    -DMETER_HW_TEST_PROFILE=8

[env:test_oled_rtc_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=9

[env:test_all_no_ade]
build_flags =
    -DMETER_HW_TEST_PROFILE=6
    -DMETER_SIM7080G_FOCUS_MODE=1

[env:test_system_contracts]
build_flags =
    -DMETER_HW_TEST_PROFILE=10

[env:test_rtc_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=11

[env:test_oled_rtc_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=12

[env:test_sd_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=13
    -DSTORAGE_SERVICE_TEST_HOOKS=1
    -DMETER_SD_BASE_DIR=\"codex_sd_test\"
    -DMETER_STORAGE_TEST_EPOCH=1767225600LL

[env:test_oled_rtc_sd_service]
build_flags =
    -DMETER_HW_TEST_PROFILE=14
    -DMETER_SIM7080G_FOCUS_MODE=1

[env:test_ade_smoke]
build_flags =
    -DMETER_HW_TEST_PROFILE=15

[env:test_ade_measurement]
build_flags =
    -DMETER_HW_TEST_PROFILE=16

[env:test_ade_full]
build_flags =
    -DMETER_HW_TEST_PROFILE=17

# Integracion funcional mientras la microSD permanece fisicamente retirada.
# Mantiene ADE, RTC, OLED, SIM7080G, MQTT, NVS y PQ; publica /datos en vivo.
[env:integration_no_sd]
build_flags =
    -DMETER_HW_TEST_PROFILE=0
    -DMETER_STORAGE_ENABLE=0
